<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GKS 한국어 레벨테스트 | Korean Level Test</title>
<meta name="description" content="글로벌한국어나눔(GKS) 한국어 레벨테스트 — 15문항으로 나의 한국어 수준을 확인해 보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="GKS 한국어 레벨테스트">
<meta property="og:description" content="15문항, 약 10분. 나의 한국어 수준을 확인해 보세요.">
<meta property="og:url" content="https://gks-site-fie.pages.dev/level.html">
<meta property="og:image" content="https://gks-site-fie.pages.dev/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GKS 한국어 레벨테스트  ·  단일 파일
   브랜드: 파랑 #4472C4 / 주황 #ED7D31 (GKS 로고 실측값)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#4472C4;
  --blue-d:#35589e;
  --orange:#ED7D31;
  --orange-d:#d2681f;
  --ink:#2e4d8f;
  --body:#3d5680;
  --muted:#7e93b8;
  --bg:#f8fafd;
  --bg2:#eef3fa;
  --line:#dbe7f8;
  --card:#ffffff;
  --ok:#2f9e6e;
  --no:#d9534f;
  --shadow:0 2px 10px rgba(46,77,143,.06), 0 12px 34px rgba(46,77,143,.08);
  --radius:18px;
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  color:var(--body);
  background:var(--bg);
  background-image:radial-gradient(1100px 520px at 50% -8%, #e7effb 0%, rgba(231,239,251,0) 68%);
  line-height:1.68;
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
.serif{font-family:'Gowun Batang','Noto Sans KR',serif}

/* ---------- 레이아웃 ---------- */
.wrap{
  max-width:600px;
  margin:0 auto;
  padding:0 18px calc(40px + env(safe-area-inset-bottom));
  position:relative;
}

.wrap > *{position:relative;z-index:1}

/* 히어로 한글 장식 (gks-site 히어로와 같은 결) */
.hero-deco{
  position:absolute;
  top:-26px; right:-16px;
  font-family:'Gowun Batang',serif;
  font-size:172px;
  font-weight:700;
  line-height:1;
  letter-spacing:.02em;
  color:var(--blue);
  opacity:.045;
  pointer-events:none;
  user-select:none;
  white-space:nowrap;
  z-index:0;
}
.card.hero{position:relative;overflow:hidden}
.card.hero > *:not(.hero-deco){position:relative;z-index:1}

/* ---------- 헤더 ---------- */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:20px 0 14px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:32px;height:32px;flex:none;
  border-radius:9px;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  color:#fff;
  font-family:'Gowun Batang',serif;
  font-weight:700;
  font-size:17px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(68,114,196,.32);
}
.brand-name{
  font-size:.86rem;font-weight:700;color:var(--ink);
  letter-spacing:-.01em;white-space:nowrap;
}
.brand-sub{display:block;font-size:.62rem;font-weight:400;color:var(--muted);letter-spacing:.06em}

.langs{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.langs button{
  font-family:inherit;font-size:.71rem;font-weight:500;
  padding:6px 12px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;transition:.18s;
}
.langs button.on{background:#dbe7f8;color:var(--ink);font-weight:700}

/* ---------- 카드 공통 ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:30px 26px;
}
.eyebrow{
  display:flex;align-items:center;gap:9px;
  font-size:.7rem;font-weight:700;letter-spacing:.16em;
  color:var(--orange);text-transform:uppercase;
  margin-bottom:12px;
}
.eyebrow .jamo{
  font-family:'Gowun Batang',serif;
  font-size:1.05rem;letter-spacing:0;color:var(--blue);
  line-height:1;
}
h1{
  font-family:'Gowun Batang',serif;
  font-size:1.72rem;font-weight:700;color:var(--ink);
  line-height:1.34;letter-spacing:-.02em;
  margin-bottom:10px;
}
h1 .en{display:block;font-size:.95rem;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:0}
.lead{font-size:.95rem;font-weight:300;color:var(--body)}

/* ---------- 안내 목록 ---------- */
.facts{
  list-style:none;
  margin:22px 0 26px;
  border-top:1px solid var(--line);
}
.facts li{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 2px;
  border-bottom:1px solid var(--line);
  font-size:.89rem;
}
.facts .k{
  flex:none;width:74px;
  font-size:.73rem;font-weight:700;color:var(--blue);
  letter-spacing:.02em;padding-top:2px;
}
.facts .v{color:var(--body);font-weight:300}
.facts .v b{font-weight:500;color:var(--ink)}

/* ---------- 입력 ---------- */
.field{margin-bottom:20px}
.field label{
  display:block;font-size:.76rem;font-weight:700;color:var(--ink);
  margin-bottom:7px;letter-spacing:.01em;
}
.field .hint{font-weight:400;color:var(--muted);font-size:.72rem}
.field input{
  width:100%;font-family:inherit;font-size:.95rem;color:var(--ink);
  padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg2);transition:.18s;
}
.field input::placeholder{color:#adbdd6}
.field input:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(68,114,196,.13)}
.field input.phone{
  max-width:240px;letter-spacing:.06em;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.why{
  font-size:.74rem;font-weight:300;color:var(--muted);
  line-height:1.62;white-space:pre-line;
  margin:-4px 0 20px;padding-left:2px;
}

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;font-family:inherit;font-size:1rem;font-weight:700;
  padding:15px 22px;border:0;border-radius:999px;cursor:pointer;
  transition:.2s;letter-spacing:-.01em;
}
.btn-primary{
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  color:#fff;box-shadow:0 5px 16px rgba(68,114,196,.32);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(68,114,196,.38)}
.btn-primary:disabled{background:#c8d6ec;color:#fff;box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--bg2)}
.btn-orange{
  background:linear-gradient(135deg,var(--orange) 0%,var(--orange-d) 100%);
  color:#fff;box-shadow:0 5px 16px rgba(237,125,49,.3);
}
.btn-row{display:flex;gap:10px;margin-top:22px}
.btn-row .btn{width:auto;flex:1}
.btn-row .btn.narrow{flex:0 0 96px;font-size:.86rem;padding:15px 10px}

/* ---------- 진행바 ---------- */
.progress-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:9px;
}
.progress-num{
  font-family:'Gowun Batang',serif;font-size:1.02rem;font-weight:700;color:var(--ink);
}
.progress-num i{font-style:normal;color:var(--muted);font-size:.84rem;font-weight:400}
.progress-label{font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.progress-track{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress-fill{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--blue) 0%,var(--orange) 100%);
  transition:width .34s cubic-bezier(.4,0,.2,1);
}

/* ---------- 문제 ---------- */
.qcard{margin-top:18px}
.q-head{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.q-jamo{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:34px;height:34px;border-radius:11px;
  background:var(--bg2);border:1px solid var(--line);
  font-family:'Gowun Batang',serif;font-size:1.1rem;font-weight:700;color:var(--blue);
}
.q-instr{font-size:.76rem;font-weight:400;color:var(--muted);line-height:1.5}
.q-text{
  font-size:1.12rem;font-weight:500;color:var(--ink);
  line-height:1.72;letter-spacing:-.01em;
  white-space:pre-wrap;
}
.q-text.long{font-size:1rem;font-weight:400;line-height:1.86}
.q-note{
  font-size:.76rem;color:var(--muted);font-weight:300;
  margin-top:9px;
}

.opts{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;
  border:1.5px solid var(--line);border-radius:14px;
  background:#fff;cursor:pointer;transition:.16s;
  font-size:.97rem;color:var(--body);text-align:left;
  font-family:inherit;width:100%;line-height:1.6;
}
.opt:hover{border-color:#b9cef0;background:var(--bg)}
.opt .no{
  flex:none;width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--line);background:#fff;
  font-size:.75rem;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  transition:.16s;margin-top:1px;
}
.opt.sel{border-color:var(--blue);background:#f2f7fe;color:var(--ink);font-weight:500}
.opt.sel .no{background:var(--blue);border-color:var(--blue);color:#fff}

.skip{
  display:block;width:100%;margin-top:14px;
  background:none;border:0;font-family:inherit;
  font-size:.79rem;color:var(--muted);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
}
.skip:hover{color:var(--blue)}

/* ---------- 결과 ---------- */
.result-top{text-align:center;padding:6px 0 4px}
.result-hello{font-size:.86rem;color:var(--muted);font-weight:300;margin-bottom:14px}
.result-hello b{color:var(--ink);font-weight:700}
.result-hello .tag{
  display:inline-block;margin:0 2px;padding:1px 9px;
  border-radius:999px;background:var(--bg2);border:1px solid var(--line);
  font-size:.74rem;font-weight:500;color:var(--blue);
  letter-spacing:.1em;font-variant-numeric:tabular-nums;
}
.score{
  font-family:'Gowun Batang',serif;
  font-size:3.7rem;font-weight:700;color:var(--blue);
  line-height:1;letter-spacing:-.03em;
}
.score .of{font-size:1.35rem;color:var(--muted);font-weight:400}
.score-pct{font-size:.8rem;color:var(--muted);margin-top:8px;letter-spacing:.04em}

.level-badge{
  display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  margin:20px auto 0;padding:11px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--orange) 0%,var(--orange-d) 100%);
  color:#fff;box-shadow:0 6px 18px rgba(237,125,49,.3);
}
.level-badge .lv{font-family:'Gowun Batang',serif;font-size:1.28rem;font-weight:700;line-height:1.2}
.level-badge .lv-en{font-size:.66rem;letter-spacing:.12em;opacity:.9;text-transform:uppercase}

.cheer{
  margin-top:22px;padding:17px 19px;
  background:var(--bg2);border-radius:14px;
  font-size:.92rem;font-weight:300;color:var(--body);
  text-align:center;line-height:1.75;
}

.capture-note{
  margin-top:18px;padding:13px 16px;
  border:1px dashed #c9d9f2;border-radius:12px;
  font-size:.79rem;color:var(--muted);text-align:center;line-height:1.65;
}

/* 문항 리뷰 */
.review-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;margin-top:18px;padding:11px;
  background:none;border:0;font-family:inherit;
  font-size:.82rem;font-weight:500;color:var(--blue);cursor:pointer;
}
.review-toggle .arrow{transition:transform .22s;font-size:.7rem}
.review-toggle.open .arrow{transform:rotate(180deg)}
.review{display:none;margin-top:6px;border-top:1px solid var(--line)}
.review.show{display:block}
.rv{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:.83rem}
.rv .rn{
  flex:none;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:700;color:#fff;margin-top:2px;
}
.rv.o .rn{background:var(--ok)}
.rv.x .rn{background:var(--no)}
.rv .rb{min-width:0;flex:1}
.rv .rq{color:var(--ink);font-weight:500;line-height:1.55;white-space:pre-wrap}
.rv .ra{color:var(--muted);font-weight:300;margin-top:3px;font-size:.79rem}
.rv .ra b{color:var(--ok);font-weight:500}
.rv .ra s{color:var(--no);text-decoration-thickness:1px;opacity:.8}

/* ---------- 푸터 ---------- */
footer{
  text-align:center;padding:26px 6px 0;
  font-size:.71rem;color:var(--muted);font-weight:300;line-height:1.8;
}
footer .sep{color:var(--line);margin:0 7px}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}

/* ---------- 화면 전환 ---------- */
.screen{display:none;animation:rise .34s cubic-bezier(.4,0,.2,1)}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- 반응형 ---------- */
@media (max-width:430px){
  .wrap{padding:0 14px 34px}
  .card{padding:25px 19px;border-radius:16px}
  h1{font-size:1.48rem}
  .q-text{font-size:1.05rem}
  .opt{font-size:.93rem;padding:13px 14px}
  .score{font-size:3.2rem}
  .facts .k{width:64px;font-size:.7rem}
  .btn{font-size:.95rem;padding:14px 18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark serif">한</div>
      <div class="brand-name">
        글로벌한국어나눔
        <span class="brand-sub">GLOBAL KOREAN SHARING</span>
      </div>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="btn-ko" class="on" onclick="setLang('ko')">한국어</button>
      <button type="button" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <!-- ===================== 시작 ===================== -->
  <section class="screen on" id="s-intro">
    <div class="card hero">
      <div class="hero-deco" aria-hidden="true">한글</div>
      <div class="eyebrow"><span class="jamo">ㄱ</span><span data-i18n="eyebrowIntro"></span></div>
      <h1>
        <span data-i18n="title"></span>
        <span class="en" data-i18n="titleEn"></span>
      </h1>
      <p class="lead" data-i18n="introLead"></p>

      <ul class="facts">
        <li><span class="k" data-i18n="factQK"></span><span class="v" data-i18n="factQV"></span></li>
        <li><span class="k" data-i18n="factTK"></span><span class="v" data-i18n="factTV"></span></li>
        <li><span class="k" data-i18n="factRK"></span><span class="v" data-i18n="factRV"></span></li>
      </ul>

      <div class="field">
        <label for="nameInput">
          <span data-i18n="nameLabel"></span>
          <span class="hint" data-i18n="nameHint"></span>
        </label>
        <input type="text" id="nameInput" autocomplete="name" maxlength="40" data-i18n-ph="namePh">
      </div>

      <div class="field">
        <label for="phoneInput">
          <span data-i18n="phoneLabel"></span>
          <span class="hint" data-i18n="phoneHint"></span>
        </label>
        <input type="tel" id="phoneInput" class="phone" inputmode="tel" autocomplete="tel" maxlength="20" data-i18n-ph="phonePh">
      </div>

      <p class="why" data-i18n="whyAsk"></p>

      <button type="button" class="btn btn-primary" id="startBtn" onclick="startTest()" disabled data-i18n="startBtn"></button>
    </div>
  </section>

  <!-- ===================== 문제 ===================== -->
  <section class="screen" id="s-quiz">
    <div class="progress-head">
      <span class="progress-num"><span id="curNo">1</span><i> / <span id="totNo">15</span></i></span>
      <span class="progress-label" data-i18n="progressLabel"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar"></div></div>

    <div class="card qcard">
      <div class="q-head">
        <span class="q-jamo serif" id="qJamo">ㄱ</span>
        <span class="q-instr" data-i18n="qInstr"></span>
      </div>
      <p class="q-text" id="qText"></p>
      <ul class="opts" id="opts"></ul>
      <button type="button" class="skip" onclick="nextQ(true)" data-i18n="skipBtn"></button>
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-ghost narrow" id="prevBtn" onclick="prevQ()" data-i18n="prevBtn"></button>
      <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextQ(false)" disabled data-i18n="nextBtn"></button>
    </div>
  </section>

  <!-- ===================== 결과 ===================== -->
  <section class="screen" id="s-result">
    <div class="card">
      <div class="eyebrow"><span class="jamo">ㅎ</span><span data-i18n="eyebrowResult"></span></div>

      <div class="result-top">
        <p class="result-hello" id="resultHello"></p>
        <div class="score serif"><span id="scoreNum">0</span><span class="of"> / <span id="scoreTot">15</span></span></div>
        <div class="score-pct" id="scorePct"></div>
        <div class="level-badge">
          <span class="lv serif" id="levelKo"></span>
          <span class="lv-en" id="levelEn"></span>
        </div>
      </div>

      <p class="cheer" id="cheer"></p>

      <button type="button" class="review-toggle" id="rvToggle" onclick="toggleReview()">
        <span data-i18n="reviewBtn"></span><span class="arrow">▼</span>
      </button>
      <div class="review" id="review"></div>

      <p class="capture-note" data-i18n="captureNote"></p>

      <div class="btn-row">
        <button type="button" class="btn btn-ghost" onclick="restart()" data-i18n="retryBtn"></button>
        <button type="button" class="btn btn-orange" onclick="goHome()" data-i18n="homeBtn"></button>
      </div>
    </div>
  </section>

  <footer>
    <span data-i18n="footOrg"></span>
    <span class="sep">·</span>
    <a href="https://gks-site-fie.pages.dev" target="_blank" rel="noopener">gks-site-fie.pages.dev</a>
    <br>
    <span data-i18n="footNote"></span>
  </footer>

</div>

<script>
/* ============================================================================
   ①  문항 데이터  —  KOREAN LEVEL TEST (A type) 원문
   ----------------------------------------------------------------------------
   2026-07-29 구글 폼 원문(PDF)에서 그대로 옮김. 지문·보기 15문항 전부 원문 일치.
   정답 번호는 응답 시트 정답줄(3,1,3,3,2,2,2,3,1,4,2,2,3,2,2)과 대조 완료.
   q : 문제 지문.  (   ) 가 빈칸.  줄바꿈은 \n
   o : 보기 4개 (순서 = 1,2,3,4번)
   a : 정답 번호 (1~4)
   ========================================================================== */
const QUESTIONS = [
  { q:'다니엘 씨는 미국(   ) 왔어요.',
    o:['이','을','에서','하고'], a:3 },

  { q:'저는 주말에는 (   ) 친구들하고 시간을 보내요.',
    o:['보통','금방','아까','이따가'], a:1 },

  { q:'가: 과일 좋아해요?\n나: 아니요, (   ).',
    o:['좋아해요','없어요','안 좋아해요','좋아하지 마세요'], a:3 },

  { q:'가: 가방이 무거워요?\n나: 아니요, (   ).',
    o:['짧아요','예뻐요','가벼워요','멋있어요'], a:3 },

/* ============================================================================
   ④  엔진
   ========================================================================== */
const JAMO = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㄲ'];

let lang = 'ko';
let idx = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let studentName = '';
let studentPhone = '';

/* ---- 다국어 ---- */
function t(key, vars){
  let s = (I18N[key] && I18N[key][lang]) || '';
  if(vars) for(const k in vars) s = s.replaceAll('{'+k+'}', vars[k]);
  return s;
}
function setLang(l){
  lang = l;
  document.documentElement.lang = (l === 'ko') ? 'ko' : 'en';
  document.getElementById('btn-ko').classList.toggle('on', l === 'ko');
  document.getElementById('btn-en').classList.toggle('on', l === 'en');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });

  if(document.getElementById('s-quiz').classList.contains('on')) renderQ();
  if(document.getElementById('s-result').classList.contains('on')) renderResult();
}

/* ---- 화면 전환 ---- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---- 시작 ---- */
function startTest(){
  studentName  = document.getElementById('nameInput').value.trim();
  studentPhone = document.getElementById('phoneInput').value.trim();
  if(!studentName || !phoneOk(studentPhone)) return;
  idx = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('totNo').textContent = QUESTIONS.length;
  show('s-quiz');
  renderQ();
}

/* ---- 문제 그리기 ---- */
function renderQ(){
  const q = QUESTIONS[idx];

  document.getElementById('curNo').textContent = idx + 1;
  document.getElementById('bar').style.width = ((idx + 1) / QUESTIONS.length * 100) + '%';
  document.getElementById('qJamo').textContent = JAMO[idx % JAMO.length];
  const qt = document.getElementById('qText');
  qt.textContent = q.q;
  qt.className = 'q-text' + (q.q.length > 90 ? ' long' : '');   // 긴 지문은 살짝 작게

  const ul = document.getElementById('opts');
  ul.innerHTML = '';
  q.o.forEach((text, i) => {
    const n = i + 1;
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (answers[idx] === n ? ' sel' : '');
    b.onclick = () => pick(n);
    b.innerHTML = '<span class="no">' + n + '</span><span>' + escapeHtml(text) + '</span>';
    li.appendChild(b);
    ul.appendChild(li);
  });

  document.getElementById('prevBtn').style.display = (idx === 0) ? 'none' : '';
  const nb = document.getElementById('nextBtn');
  nb.textContent = (idx === QUESTIONS.length - 1) ? t('lastBtn') : t('nextBtn');
  nb.disabled = (answers[idx] === null);
}

function pick(n){
  answers[idx] = n;
  document.querySelectorAll('#opts .opt').forEach((el, i) => {
    el.classList.toggle('sel', i + 1 === n);
  });
  document.getElementById('nextBtn').disabled = false;
}

function nextQ(skip){
  if(skip) answers[idx] = null;
  if(idx === QUESTIONS.length - 1){ finish(); return; }
  idx++;
  renderQ();
  window.scrollTo({top:0, behavior:'smooth'});
}

function prevQ(){
  if(idx === 0) return;
  idx--;
  renderQ();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---- 채점 ---- */
function score(){
  let s = 0;
  QUESTIONS.forEach((q, i) => { if(answers[i] === q.a) s++; });
  return s;
}
function levelOf(s){
  return LEVELS.find(l => s >= l.min) || LEVELS[LEVELS.length - 1];
}

function finish(){
  show('s-result');
  renderResult();
}

function renderResult(){
  const s   = score();
  const tot = QUESTIONS.length;
  const pct = Math.round(s / tot * 100);
  const lv  = levelOf(s);

  const who = '<b>' + escapeHtml(studentName) + '</b>' +
              (studentPhone ? '<span class="tag">' + escapeHtml(studentPhone) + '</span>' : '');
  document.getElementById('resultHello').innerHTML =
    studentName ? t('helloNamed', {name:who}) : t('helloPlain');
  document.getElementById('scoreNum').textContent = s;
  document.getElementById('scoreTot').textContent = tot;
  document.getElementById('scorePct').textContent = t('pct', {p:pct});
  document.getElementById('levelKo').textContent  = (lang === 'ko') ? lv.ko : lv.en;
  document.getElementById('levelEn').textContent  = (lang === 'ko') ? lv.en : lv.ko;
  document.getElementById('cheer').textContent    = (lang === 'ko') ? lv.cheerKo : lv.cheerEn;

  const rv = document.getElementById('review');
  rv.innerHTML = QUESTIONS.map((q, i) => {
    const mine = answers[i];
    const ok   = mine === q.a;
    const correctTxt = q.a + ') ' + q.o[q.a - 1];
    let line;
    if(ok)             line = t('answerLine',      {correct:escapeHtml(correctTxt)});
    else if(mine)      line = t('answerLineWrong', {mine:escapeHtml(mine + ') ' + q.o[mine - 1]), correct:escapeHtml(correctTxt)});
    else               line = t('answerLineSkip',  {correct:escapeHtml(correctTxt)});
    const stem = q.q.replace(/\n/g, ' ');
    return '<div class="rv ' + (ok ? 'o' : 'x') + '">' +
             '<span class="rn">' + (i + 1) + '</span>' +
             '<div class="rb"><div class="rq">' + escapeHtml(stem) + '</div>' +
             '<div class="ra">' + line + '</div></div>' +
           '</div>';
  }).join('');
}

function toggleReview(){
  document.getElementById('review').classList.toggle('show');
  document.getElementById('rvToggle').classList.toggle('open');
}

function restart(){
  idx = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('review').classList.remove('show');
  document.getElementById('rvToggle').classList.remove('open');
  checkReady();
  show('s-intro');
}

/* ---- 전화번호 정리 : 한국 번호는 자동으로 하이픈, 해외(+) 번호는 그대로 ---- */
function formatPhone(raw){
  let v = String(raw).replace(/[^\d+]/g, '');
  if(v.indexOf('+') === 0) return '+' + v.replace(/\D/g, '').slice(0, 15);   // 해외 번호
  v = v.replace(/\D/g, '').slice(0, 11);
  if(v.indexOf('02') === 0 && v.length > 2){                                  // 서울 지역번호
    const r = v.slice(2);
    return '02-' + (r.length > 4 ? r.slice(0, r.length - 4) + '-' + r.slice(r.length - 4) : r);
  }
  if(v.length > 7)  return v.slice(0, 3) + '-' + v.slice(3, v.length - 4) + '-' + v.slice(v.length - 4);
  if(v.length > 3)  return v.slice(0, 3) + '-' + v.slice(3);
  return v;
}
function phoneOk(v){ return (String(v).replace(/\D/g, '').length >= 9); }

/* ---- 시작 버튼 활성화 (이름 + 전화번호가 모두 채워져야 함) ---- */
function checkReady(){
  const n = document.getElementById('nameInput').value.trim();
  const p = document.getElementById('phoneInput').value.trim();
  document.getElementById('startBtn').disabled = !(n.length > 0 && phoneOk(p));
}
document.getElementById('nameInput').addEventListener('input', checkReady);
document.getElementById('phoneInput').addEventListener('input', function(){
  const atEnd = (this.selectionStart === this.value.length);
  this.value = formatPhone(this.value);
  if(atEnd) this.setSelectionRange(this.value.length, this.value.length);
  checkReady();
});

function goHome(){
  window.location.href = 'https://gks-site-fie.pages.dev';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- 키보드 ---- */
document.addEventListener('keydown', e => {
  if(!document.getElementById('s-quiz').classList.contains('on')) return;
  if(e.key >= '1' && e.key <= '4'){
    const n = Number(e.key);
    if(n <= QUESTIONS[idx].o.length) pick(n);
  }
  if(e.key === 'Enter' && !document.getElementById('nextBtn').disabled) nextQ(false);
  if(e.key === 'ArrowLeft') prevQ();
});

/* ---- 초기화 ---- */
document.getElementById('totNo').textContent = QUESTIONS.length;
document.getElementById('scoreTot').textContent = QUESTIONS.length;
setLang('ko');
</script>
