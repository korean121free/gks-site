name = "gks-class"
main = "src/index.js"
compatibility_date = "2026-07-01"

# GKS 전용 Cloudflare 계정 (korean121free@gmail.com)
# 이중 잠금 — 다른 계정으로 배포하려 하면 wrangler가 거부합니다
account_id = "ef455f05c07e1a9a08d899ea85d560c3"

[[d1_databases]]
binding = "DB"
database_name = "gks-class-log"
database_id = "1f336c5e-c7c9-480b-a5a0-c3a2c3c32939"

# 사진 보관함 — 지금은 D1(photo_blob 표)에 담고 있습니다. 이대로도 잘 됩니다.
# R2로 옮기고 싶으면: 대시보드에서 R2를 한 번 켠 뒤(계정당 1회),
#   worker\wr.bat r2 bucket create gks-photos
# 를 실행하고 아래 세 줄의 # 을 지우고 배포하면 됩니다.
# 그때부터 새 사진만 R2로 가고, 이미 담긴 사진은 D1에서 그대로 나옵니다.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "gks-photos"

[vars]
# 이 주소에서 온 요청만 받습니다 (자체 도메인이 생기면 여기에 추가)
ALLOWED_ORIGINS = "https://gks-site-fie.pages.dev,http://localhost:8788"
# 참고용 — 실제 접속 주소는 class.html의 LK_URL을 씁니다
LIVEKIT_URL = "wss://gks-577c6bjr.livekit.cloud"

# 비밀값은 여기 쓰지 않습니다. 터미널에서 따로 넣습니다:
#   wrangler secret put LIVEKIT_API_KEY
#   wrangler secret put LIVEKIT_API_SECRET
#   wrangler secret put ADMIN_KEY
